app-id: com.danilo.chatgptdesktop
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: chatgpt-desktop
finish-args:
  # Rede necessária para acessar https://chatgpt.com
  - --share=network
  # Exibição (Wayland/X11)
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  # Áudio/microfone (validação necessária; pode variar por portal/PipeWire)
  - --socket=pulseaudio
  # Notificações/portais (conforme necessário)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # Acesso a arquivos via portal (uploads) — preferir portals; evitar --filesystem amplo
  - --filesystem=xdg-download:ro
modules:
  - name: chatgpt-desktop
    buildsystem: simple
    build-commands:
      # Manifesto de referência: requer build Tauri dentro do sandbox/SDK ou uso de binário pré-compilado.
      # Para empacotamento reproduzível, prefira pipeline Flatpak com fontes e dependências Rust/Node vendorizadas,
      # ou gere um bundle a partir de artefato validado conforme política de distribuição.
      - install -Dm755 chatgpt-desktop /app/bin/chatgpt-desktop
      - install -Dm644 packaging/chatgpt-desktop.desktop /app/share/applications/com.danilo.chatgptdesktop.desktop
      - install -Dm644 src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.danilo.chatgptdesktop.png
      - install -Dm644 src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/com.danilo.chatgptdesktop.png
    sources:
      # Ajustar para a origem real do release (arquivo local, arquivo remoto com sha256, ou repositório).
      - type: file
        path: ../../src-tauri/target/release/chatgpt-desktop
        dest-filename: chatgpt-desktop
      - type: dir
        path: ../..
        dest: .
