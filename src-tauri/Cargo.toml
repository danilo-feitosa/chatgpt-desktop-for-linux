[package]
name = "chatgpt-desktop"
version = "0.1.0"
description = "Cliente desktop Linux independente para ChatGPT Web (não oficial)"
authors = ["Danilo"]
edition = "2024"
license = "MIT"
repository = ""

[lib]
# O sufixo `_lib` evita conflito com o binário em algumas plataformas.
name = "chatgpt_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
